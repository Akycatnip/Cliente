<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Centro Cultural GCapitán · Actividades</title>
    <link rel="stylesheet" href="actividades.css">
    <script type="module" src="actividades.js"></script>
</head>

<body>
    <header>
        <h1>Centro Cultural GCapitán</h1>
        <p class="lema">Aprende, crea y comparte · Actividades para todos</p>
    </header>

    <main>
        <section class="zona-catalogo">
            <h2>Actividades disponibles</h2>

            <p>
                <label for="buscador">Buscar actividad</label>
                <input id="buscador" type="text" placeholder="Escribe el nombre de una actividad">
            </p>

            <p>
                <label for="filtro">Filtrar por categoría</label>
                <select id="filtro">
                    <option value="">Todas las categorías</option>
                    <option value="Literatura">Literatura</option>
                    <option value="Arte">Arte</option>
                    <option value="Tecnología">Tecnología</option>
                </select>
            </p>

            <!-- Aquí JavaScript añadirá los li de las actividades -->
            <ul id="catalogo"></ul>

            <!-- Aquí se mostrarán mensajes e información al pasar el ratón -->
            <p id="info"></p>
        </section>

        <section class="zona-reservas">
            <h2>Tus reservas</h2>

            <!-- Aquí JavaScript añadirá un li por cada actividad reservada -->
            <ul id="reservas"></ul>

            <!-- Aquí se mostrará el importe total -->
            <p id="total"></p>

            <button id="vaciar" type="button">Cancelar todas las reservas</button>

            <form id="formulario" novalidate>
                <h3>Datos de inscripción</h3>

                <p>
                    <label for="nombre">Nombre</label>
                    <input id="nombre" name="nombre" type="text" required minlength="3">
                    <span class="error"></span>
                </p>

                <p>
                    <label for="correo">Correo electrónico</label>
                    <input id="correo" name="correo" type="email" required>
                    <span class="error"></span>
                </p>

                <p>
                    <label for="telefono">Teléfono móvil</label>
                    <input id="telefono" name="telefono" type="tel"
                           pattern="[67]\d{8}" required>
                    <span class="error"></span>
                </p>

                <p>
                    <label for="asistentes">Número de asistentes</label>
                    <input id="asistentes" name="asistentes" type="number"
                           min="1" max="4" required>
                    <span class="error"></span>
                </p>

                <p>
                    <label for="categoria">Categoría de interés</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Elige una categoría</option>
                        <option value="Literatura">Literatura</option>
                        <option value="Arte">Arte</option>
                        <option value="Tecnología">Tecnología</option>
                    </select>
                    <span class="error"></span>
                </p>

                <p>
                    <button type="submit">Enviar inscripción</button>
                </p>
            </form>

            <!-- Aquí se mostrará el resultado del envío -->
            <p id="aviso"></p>
        </section>
    </main>
</body>

</html>
