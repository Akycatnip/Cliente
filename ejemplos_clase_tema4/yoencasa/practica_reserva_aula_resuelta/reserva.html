<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reserva de puestos · IES Gran Capitán</title>
  <link rel="stylesheet" href="reserva.css">
  <script type="module" src="reserva.js"></script>
</head>
<body>
  <header>
    <h1>IES Gran Capitán · Reserva de puestos</h1>
    <p>Elige tu aula, selecciona tus sillas y confirma la reserva.</p>
  </header>

  <main>
    <section class="zona-aula">
      <h2>Selecciona tu aula</h2>

      <p>
        <label for="grupo">Grupo</label>
        <select id="grupo">
          <option value="">Selecciona un grupo</option>
          <option value="1º DAW">1º DAW</option>
          <option value="2º DAW">2º DAW</option>
          <option value="1º DAM">1º DAM</option>
        </select>
      </p>

      <p>
        <label for="buscador">Buscar una silla</label>
        <input id="buscador" type="text" placeholder="Ejemplo: A2">
      </p>

      <p class="leyenda">
        <span class="libre">Libre</span>
        <span class="ocupada">Ocupada</span>
        <span class="seleccionada">Seleccionada</span>
      </p>

      <div id="aula" aria-label="Plano de las sillas"></div>
      <p id="info"></p>
    </section>

    <section class="zona-reserva">
      <h2>Tu reserva</h2>
      <p id="resumen">Todavía no has seleccionado ninguna silla.</p>
      <p id="total"></p>

      <form id="formulario" novalidate>
        <h3>Datos de la reserva</h3>

        <fieldset>
          <legend>Turno (elige uno)</legend>
          <label><input type="radio" name="turno" value="Mañana" required> Mañana</label>
          <label><input type="radio" name="turno" value="Tarde"> Tarde</label>
          <span class="error"></span>
        </fieldset>

        <fieldset>
          <legend>Material adicional (puedes elegir varios)</legend>
          <label><input type="checkbox" name="material" value="Auriculares"> Auriculares (+2 €)</label>
          <label><input type="checkbox" name="material" value="Ratón"> Ratón (+3 €)</label>
          <label><input type="checkbox" name="material" value="Adaptador USB"> Adaptador USB (+4 €)</label>
        </fieldset>

        <p>
          <label for="nombre">Nombre y apellidos</label>
          <input id="nombre" name="nombre" type="text" required>
          <span class="error"></span>
        </p>

        <p>
          <label for="correo">Correo del instituto</label>
          <input id="correo" name="correo" type="text" required>
          <span class="error"></span>
        </p>

        <p>
          <label for="telefono">Teléfono</label>
          <input id="telefono" name="telefono" type="text" required>
          <span class="error"></span>
        </p>

        <p class="aceptacion">
          <label><input id="condiciones" name="condiciones" type="checkbox" required>
            Confirmo que los datos son correctos</label>
          <span class="error"></span>
        </p>

        <button type="submit">Confirmar reserva</button>
      </form>

      <p id="aviso"></p>
    </section>
  </main>
</body>
</html>
